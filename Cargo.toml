[workspace]
resolver = "2"
members = ["crates/merc-core", "crates/merc-store", "crates/merc-supervisor"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
rust-version = "1.80"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }
regex = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
tempfile = "3"

[package]
name = "tauri-plugin-mercphone"
description = "Parte Android de MercHosting: datos del celular y servicio en primer plano que corre el servidor Java."
version.workspace = true
edition.workspace = true
license.workspace = true
# Tauri usa `links` para encontrar la carpeta `android/` del plugin al generar el proyecto.
links = "tauri-plugin-mercphone"

[dependencies]
serde.workspace = true
serde_json.workspace = true
tauri = { version = "2", default-features = false }

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }

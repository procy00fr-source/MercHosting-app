[package]
name = "merc-admin"
description = "Administración local de un servidor: server.properties, jugadores y archivos confinados."
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp", "ico", "tiff"] }
merc-core = { path = "../merc-core" }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
regex.workspace = true
zip = { version = "9", default-features = false, features = ["deflate"] }
flate2 = "1"
sha2 = "0.10"
sysinfo = { workspace = true, features = ["disk"] }
toml = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

[dev-dependencies]
tempfile.workspace = true
